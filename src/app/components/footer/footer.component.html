<footer>
  <ul class="social-networks">
    <li *ngFor="let network of socialNetworks">
      <a [href]="network.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="network.icon">
        <i [class]="'icon-' + network.icon" aria-hidden="true"></i>
      </a>
    </li>
  </ul>
  <div class="copyright">
    <span class="copyright__author"><span class="copyright__label">Copyright </span>© {{ currentYear }} - <a href="/">Aurore Salavert</a></span>
    <ng-container *ngIf="privacyPolicyLink && privacyPolicyTitle">
      <span class="copyright__separator" aria-hidden="true">-</span>
      <a class="copyright__privacy" [href]="privacyPolicyLink">{{ privacyPolicyTitle }}</a>
    </ng-container>
    <ng-container *ngIf="manageCookiesLabel">
      <span class="copyright__separator" aria-hidden="true">-</span>
      <button type="button" class="copyright__cookies link" (click)="openCookieBanner()">{{ manageCookiesLabel }}</button>
    </ng-container>
  </div>
</footer>
<div class="privacy-policy-mobile" *ngIf="(privacyPolicyLink && privacyPolicyTitle) || manageCookiesLabel">
  <a *ngIf="privacyPolicyLink && privacyPolicyTitle" [href]="privacyPolicyLink">{{ privacyPolicyTitle }}</a>
  <button *ngIf="manageCookiesLabel" type="button" class="cookies-button link" (click)="openCookieBanner()">{{ manageCookiesLabel }}</button>
</div>
