<div *ngIf="project" class="project">
  <div class="project__content">
    <div class="project__navigation">
      <button 
        (click)="navigateToPreviousProject()" 
        [disabled]="currentIndex === 0" 
        [title]="titlePrev"
        class="btn-nav"
      >
        <i class="material-symbols-outlined">arrow_back</i>
      </button>
      <h1>{{ project.title }}<span>:</span></h1>
      <button 
        (click)="navigateToNextProject()" 
        [disabled]="currentIndex === projects.length - 1" 
        [title]="titleNext"
        class="btn-nav"
      >
        <i class="material-symbols-outlined">arrow_forward</i>
      </button>
    </div>


    <div class="project__content__description" [innerHTML]="projectDescriptionHtml"></div>

    <div class="project__content__categories" *ngIf="project.categories.length > 0">
      <h4>Categories<span>:</span></h4>
      <div class="category">
        <div *ngFor="let category of project.categories; let index = index" class="category__tag">
          {{ category.title }}
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="project.gallery.length > 0" class="project__gallery">
    <div class="gallery-item" *ngFor="let item of project.gallery">
      <ng-container *ngIf="item.mediaType === 'video'; else galleryImageTemplate">
        <div
          #videoWrapper
          class="gallery-video-wrapper"
          [class.is-playing]="isVideoPlaying(item.id)"
          [attr.data-video-wrapper-id]="item.id"
        >
          <video
            #projectVideo
            class="gallery-media gallery-video"
            muted
            loop
            playsinline
            preload="metadata"
            [src]="item.img"
            [attr.data-media-id]="item.id"
            [attr.aria-label]="item.alt"
            (click)="toggleVideoPlayback($event, projectVideo, item.id)"
            (loadedmetadata)="onVideoMetadataLoaded(item.id, projectVideo)"
            (timeupdate)="onVideoTimeUpdate(item.id, projectVideo)"
            (play)="setVideoPlaying(item.id, true)"
            (pause)="setVideoPlaying(item.id, false)"
            (ended)="setVideoPlaying(item.id, false)"
          >
            Votre navigateur ne prend pas en charge la lecture de cette vidéo.
          </video>

          <button
            *ngIf="!isVideoPlaying(item.id)"
            class="gallery-video-play-button"
            type="button"
            [attr.aria-label]="'Lire ' + item.alt"
            (click)="playVideo($event, projectVideo, item.id)"
          >
            <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
          </button>

          <div class="gallery-video-controls" role="group" [attr.aria-label]="'Contrôles pour ' + item.alt">
            <button
              class="video-control-button"
              type="button"
              [attr.aria-label]="isVideoPlaying(item.id) ? 'Mettre en pause' : 'Lire la vidéo'"
              (click)="toggleVideoPlayback($event, projectVideo, item.id)"
            >
              <span class="material-symbols-outlined" aria-hidden="true">{{ isVideoPlaying(item.id) ? 'pause' : 'play_arrow' }}</span>
            </button>

            <span class="gallery-video-time">{{ formatVideoTime(videoCurrentTimeState[item.id]) }}</span>

            <input
              class="gallery-video-progress"
              type="range"
              min="0"
              step="0.01"
              [max]="videoDurationState[item.id] || 0"
              [value]="videoCurrentTimeState[item.id] || 0"
              [attr.aria-label]="'Position dans ' + item.alt"
              [attr.aria-valuetext]="formatVideoTime(videoCurrentTimeState[item.id])"
              (input)="seekVideo($event, projectVideo, item.id)"
            >

            <span class="gallery-video-time">{{ formatVideoTime(videoDurationState[item.id]) }}</span>

            <button
              class="video-control-button"
              type="button"
              [attr.aria-label]="isVideoMuted(item.id) ? 'Activer le son' : 'Couper le son'"
              (click)="toggleVideoMute($event, projectVideo, item.id)"
            >
              <span class="material-symbols-outlined" aria-hidden="true">{{ isVideoMuted(item.id) ? 'volume_off' : 'volume_up' }}</span>
            </button>

            <button
              class="video-control-button"
              type="button"
              [attr.aria-label]="isVideoFullscreen(item.id) ? 'Quitter le plein écran' : 'Afficher la vidéo en plein écran'"
              (click)="toggleVideoFullscreen($event, videoWrapper, projectVideo, item.id)"
            >
              <span class="material-symbols-outlined" aria-hidden="true">{{ isVideoFullscreen(item.id) ? 'fullscreen_exit' : 'fullscreen' }}</span>
            </button>
          </div>
        </div>
      </ng-container>

      <ng-template #galleryImageTemplate>
        <img #galleryImage [src]="item.img" [alt]="item.alt" class="gallery-media gallery-image" (click)="toggleImageSize($event, item)" loading="lazy">

        <button class="gallery-item__expand-button" type="button" aria-label="Agrandir l'image" (click)="toggleImageSize($event, item)">
          <span class="material-symbols-outlined">expand_content</span>
        </button>
      </ng-template>
    </div>
  </div>

  <div class="modal-backdrop" [ngClass]="{'is-expanded': isImageExpanded}">
    <img [ngClass]="{'is-visible': isImageExpanded}" 
       [src]="expandedImageSrc"
       alt="Expanded Image" 
       class="expanded-image" 
       (click)="zoomImage($event)"
       (mousemove)="moveLens($event)">

    <div class="zoom-lens" id="lens" *ngIf="isImageExpanded"></div>
  
    <button class="gallery-item__close-expand-button" type="button" aria-label="Fermer l'image agrandie" (click)="closeImage()">
      <span class="material-symbols-outlined">collapse_content</span>
    </button>
  </div>
</div>
